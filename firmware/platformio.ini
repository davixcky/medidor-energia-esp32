; Firmware del medidor de energía de dos canales (ESP32-DevKitC V4).
; Compilar:  pio run          Cargar:  pio run -t upload       Monitor:  pio device monitor
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; ARDUINO_EVENT_RUNNING_CORE=0: los eventos de Wi-Fi corren en el núcleo 0, junto con la red;
; el núcleo 1 queda para la adquisición.
build_flags = -DFW_VERSION=\"fw-v1.3.0\" -DARDUINO_EVENT_RUNNING_CORE=0 -Wall
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit NeoPixel@1.12.5
